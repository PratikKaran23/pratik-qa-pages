<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W13 Add-on Probe</title>
<style>
  body{font:12px/1.4 -apple-system,Menlo,monospace;margin:8px;background:#fff;color:#222}
  h3{margin:4px 0}
  #log{white-space:pre-wrap;word-break:break-all;border:1px solid #ccc;padding:6px;max-height:340px;overflow:auto;background:#fafafa}
  button{margin:2px;font-size:11px}
  .grid{display:flex;flex-wrap:wrap}
  .kv{color:#555}
  .warn{color:#b00}
</style>
</head>
<body>
<h3>W13 add-on probe <span class="kv" id="who"></span></h3>
<div id="cmds" class="grid"></div>
<textarea id="custom" rows="2" style="width:97%" placeholder='{"action":"...","payload":{...}}'></textarea>
<div><button onclick="postCustom()">post custom JSON</button>
<button onclick="clearLog()">clear log</button>
<button onclick="dumpFacts()">dump facts</button></div>
<pre id="log"></pre>
<script>
"use strict";
var LOG = [];
var histKey = "w13_token_history_v1";
var fullKey = "w13_tokens_full_v1";

function now(){ return new Date().toISOString(); }
function mask(tok){ return tok ? ("..." + tok.slice(-6) + " (len " + tok.length + ")") : null; }
function claimsOf(tok){ try { return JSON.parse(atob(tok.split(".")[1])); } catch(e){ return null; } }
function slim(c){ if(!c) return null; return {iss:c.iss,type:c.type,sub:c.sub,addonId:c.addonId,workspaceId:c.workspaceId,user:c.user,workspaceRole:c.workspaceRole,exp:c.exp,backendUrl:c.backendUrl}; }
function log(kind, data){ LOG.push({t:now(), kind:kind, data:data}); render(); }
function render(){
  var el = document.getElementById("log");
  if (el) el.textContent = LOG.map(function(l){ return l.t + " [" + l.kind + "] " + JSON.stringify(l.data); }).join("\n");
}
function clearLog(){ LOG = []; render(); }

// ---- capture own URL/token on every load (this iframe is re-loaded on token refresh) ----
var qs = new URLSearchParams(location.search);
var token = qs.get("auth_token");
var claims = claimsOf(token);
var hist = [];
try { hist = JSON.parse(sessionStorage.getItem(histKey) || "[]"); } catch(e){}
var full = [];
try { full = JSON.parse(sessionStorage.getItem(fullKey) || "[]"); } catch(e){}
var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0] || {};
var loadEntry = {
  ts: Date.now(),
  url: location.href,
  origin: location.origin,
  isTop: (window === window.top),
  referrer: document.referrer || null,
  navType: nav.type || null,
  qs: {userId: qs.get("userId"), initialUrl: qs.get("initialUrl"), hasAuthToken: !!token},
  tokenMasked: mask(token),
  claims: slim(claims)
};
hist.push({ts: loadEntry.ts, masked: loadEntry.tokenMasked, claims: loadEntry.claims, userIdQ: qs.get("userId"), initialUrl: qs.get("initialUrl")});
try { sessionStorage.setItem(histKey, JSON.stringify(hist)); } catch(e){}
if (token) { full.push({ts: Date.now(), len: token.length, tail: token.slice(-24)}); try { sessionStorage.setItem(fullKey, JSON.stringify(full)); } catch(e){} }

// detect if our token rotated between loads: compare claim fingerprints
var rotated = null;
for (var i = hist.length - 2; i >= 0; i--) {
  if (hist[i].masked && loadEntry.tokenMasked && hist[i].masked !== loadEntry.tokenMasked) {
    rotated = {prevMasked: hist[i].masked, prevClaims: hist[i].claims, currMasked: loadEntry.tokenMasked, currClaims: loadEntry.claims};
    break;
  }
}
log("load", {entry: loadEntry, loadCount: hist.length, tokenRotatedVsEarlierLoad: rotated});

// ---- listen to EVERY message the parent sends ----
window.addEventListener("message", function(e){
  var d = e.data;
  if (typeof d !== "string") { try { d = JSON.stringify(d); } catch(x){ d = String(d); } }
  log("message-in", {origin: e.origin, source: (e.source === window.parent ? "parent" : "other"), data: (d || "").slice(0, 3000)});
});

// ---- send events to the parent (documented + dispatcher extras) ----
function post(obj, label){
  var msg = (typeof obj === "string") ? obj : JSON.stringify(obj);
  try { window.top.postMessage(msg, "*"); log("sent", {label: label, msg: msg}); }
  catch(e){ log("send-error", {label: label, err: String(e)}); }
}
function postCustom(){
  var v = document.getElementById("custom").value.trim();
  if (!v) return;
  var obj; try { obj = JSON.parse(v); } catch(e){ obj = v; }
  post(obj, "custom");
}
var TESTS = {
  "refreshAddonToken (documented)": {action:"refreshAddonToken"},
  "refresh (undocumented alias)": {action:"refresh"},
  "preview -> real key (documented)": {action:"preview", payload:{type:"addon", param:"w13-postmsg-probe"}},
  "preview -> none key": {action:"preview", payload:{type:"addon", param:"w13-nonexistent-zzz"}},
  "navigate tracker (documented)": {action:"navigate", payload:{type:"tracker"}},
  "navigate addonList": {action:"navigate", payload:{type:"addonList", param: "6acdda97e14d56abdbbb172f"}},
  "navigate addonSettings": {action:"navigate", payload:{type:"addonSettings", param:"w13-postmsg-probe"}},
  "navigate subscriptionPlans": {action:"navigate", payload:{type:"subscriptionPlans"}},
  "navigate MP addon (payload param)": {action:"navigate", payload:{product:"MARKETPLACE", type:"addon", param:"w13-probe-path"}},
  "toastrPop (documented)": {action:"toastrPop", payload:{type:"error", message:"w13 toast probe <b>x</b>"}},
  "throwErrorContent": {action:"throwErrorContent"},
  "logout (undocumented)": {action:"logout"},
  "showBackdrop": {action:"showBackdrop"},
  "hideBackdrop": {action:"hideBackdrop"},
  "navigateToTracker": {action:"navigateToTracker"},
  "closeBrowseMarketplaceModal": {action:"closeBrowseMarketplaceModal"}
};
function buildButtons(){
  var host = document.getElementById("cmds");
  Object.keys(TESTS).forEach(function(k){
    var b = document.createElement("button");
    b.textContent = k;
    b.onclick = function(){ post(TESTS[k], k); };
    host.appendChild(b);
  });
}
function dumpFacts(){
  log("facts", {
    logCount: LOG.length,
    loads: hist,
    tokenRotations: hist.filter(function(h,i){ return i>0 && h.masked !== hist[i-1].masked; }).length,
    sessionStorageKeys: Object.keys(sessionStorage)
  });
}
buildButtons();
var c = claims;
document.getElementById("who").textContent = c ? ("addon=" + c.addonId + " user=" + c.user + " ws=" + c.workspaceId + " role=" + c.workspaceRole + " type=" + c.type) : "(no auth_token)";
</script>
</body>
</html>
